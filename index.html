<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Equipment Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f2f6fa; color: #1c2b39; }
    .page { max-width: 1000px; margin: 0 auto; padding: 16px; }
    h1 { text-align: center; }
    h2 { margin-top: 28px; font-size: 18px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px #0001; }
    .card span { display: block; color: #667; font-size: 14px; }
    .card b { font-size: 28px; color: #0a7ea4; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .toolbar input { flex: 1; min-width: 180px; }
    input, select, button { padding: 10px; border: 1px solid #ccd; border-radius: 8px; font-size: 14px; }
    button { background: #0a7ea4; color: #fff; border: none; cursor: pointer; }
    .table-wrap { overflow-x: auto; background: #fff; border-radius: 10px; box-shadow: 0 1px 4px #0001; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; white-space: nowrap; }
    th { background: #e6f1f6; font-size: 13px; }
    tr:not(:last-child) td { border-bottom: 1px solid #eef; }
    .empty { text-align: center; color: #889; }
    #status { text-align: center; color: #c0392b; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="page">
    <h1>🏥 Hospital Equipment Tracker</h1>

    <div class="cards">
      <div class="card"><span>Total Machines</span><b id="total">0</b></div>
      <div class="card"><span>Locations</span><b id="locs">0</b></div>
      <div class="card"><span>Recent Scans</span><b id="recent">0</b></div>
    </div>

    <div class="toolbar">
      <input id="search" placeholder="Search machine or RFID..." />
      <select id="location"><option value="">All locations</option></select>
      <button id="refresh">🔄 Refresh</button>
    </div>
    <div id="status"></div>

    <h2>Current Machine Locations</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>RFID</th><th>Machine</th><th>Room</th><th>Location</th><th>Department</th><th>Last Scanned</th></tr></thead>
        <tbody id="machines"></tbody>
      </table>
    </div>

    <h2>Recent Scans</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Time</th><th>RFID</th><th>Machine</th><th>Room</th><th>Device</th></tr></thead>
        <tbody id="scans"></tbody>
      </table>
    </div>
  </div>

<script>
  // 👇 Paste your Google Apps Script Web App URL here
  const SCRIPT_URL = "https://script.google.com/macros/library/d/1JHmEw7AH2hbbcHQYtd0Qa51TrN5vlHQWAddQi_HLKqbSryQ1OUj2XXjL/2";

  let machines = [];
  let scans = [];

  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? "-").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (t) => t ? new Date(t).toLocaleString([], { hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" }) : "Never";

  // Loads data using a <script> tag (JSONP) so CORS never blocks it
  function loadData() {
    return new Promise((resolve, reject) => {
      const name = "cb" + Date.now();
      const s = document.createElement("script");
      const timer = setTimeout(() => { cleanup(); reject(new Error("timed out")); }, 15000);
      const cleanup = () => { clearTimeout(timer); delete window[name]; s.remove(); };
      window[name] = (d) => { cleanup(); resolve(d); };
      s.onerror = () => { cleanup(); reject(new Error("script failed to load")); };
      s.src = SCRIPT_URL + "?callback=" + name;
      document.body.appendChild(s);
    });
  }

  async function load() {
    try {
      const data = await loadData();

      // names from the Machines tab
      const names = {};
      const latest = {};
      data.machines.forEach((m) => { names[m.rfidTag] = m.machineName; latest[m.rfidTag] = { rfidTag: m.rfidTag }; });

      // newest scan per tag = current location (rows are oldest -> newest)
      data.scans.forEach((s) => { latest[s.rfidTag] = s; });

      machines = Object.values(latest).map((m) => ({ ...m, machineName: names[m.rfidTag] || m.machineName || "Unknown Machine" }));
      scans = data.scans.slice(-10).reverse();
      $("status").textContent = "";
    } catch (e) {
      $("status").textContent = "Could not load data (" + e.message + "). Check SCRIPT_URL and redeploy the script as a New version.";
    }
    render();
  }

  function render() {
    const locations = [...new Set(machines.map((m) => m.location).filter(Boolean))];
    const selected = $("location").value;
    $("location").innerHTML = '<option value="">All locations</option>' +
      locations.map((l) => `<option ${l === selected ? "selected" : ""}>${esc(l)}</option>`).join("");

    const q = $("search").value.toLowerCase();
    const shown = machines.filter((m) =>
      `${m.rfidTag} ${m.machineName}`.toLowerCase().includes(q) && (!selected || m.location === selected));

    $("total").textContent = machines.length;
    $("locs").textContent = locations.length;
    $("recent").textContent = scans.length;

    $("machines").innerHTML = shown.length
      ? shown.map((m) => `<tr><td>${esc(m.rfidTag)}</td><td>${esc(m.machineName)}</td><td>${esc(m.room)}</td><td>${esc(m.location)}</td><td>${esc(m.department)}</td><td>${fmt(m.time)}</td></tr>`).join("")
      : '<tr><td colspan="6" class="empty">No machines found</td></tr>';

    $("scans").innerHTML = scans.length
      ? scans.map((s) => `<tr><td>${fmt(s.time)}</td><td>${esc(s.rfidTag)}</td><td>${esc(s.machineName)}</td><td>${esc(s.room)}</td><td>${esc(s.deviceId)}</td></tr>`).join("")
      : '<tr><td colspan="5" class="empty">No scans yet</td></tr>';
  }

  $("search").addEventListener("input", render);
  $("location").addEventListener("change", render);
  $("refresh").addEventListener("click", load);

  load();
  setInterval(load, 15000); // auto refresh every 15s
</script>
</body>
</html>
